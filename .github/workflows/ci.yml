name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build — compilar el proyecto
        run: mvn -B compile

      - name: Test — ejecutar pruebas unitarias y de integración
        run: mvn -B test

      - name: Publicar reporte de tests
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Resultados de pruebas
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit